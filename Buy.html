<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Buy</title>
        <link rel="stylesheet" href="../style.css">
        </head>
    <body>
        <header>
            <h1>Замовити товар</h1>
        </header>

        <main>
            <section>
                <form>
                    <label>Ваше ім'я:</label><br>
                    <input type="text" name="name"><br><br>

            <label>Номер телефону:</label><br>
            <input type="tel" name="phone"><br><br>

            <label>Спосіб оплати:</label><br>
            <select name="payment">
                <option>Готівка</option>
                <option>Картка</option>
                <option>Розстрочка</option>
            </select><br><br>

            <label>Оберіть товар:</label><br>
            <select name="product">
                <option>Gaming PC Ultra</option>
                <option>Office PC Pro</option>
                <option>SmartPhone X Pro</option>
                <option>SmartPhone Lite</option>
                <option>Laptop Pro 15</option>
                <option>Laptop Air</option>
                <option>Smart Refrigerator</option>
                <option>Robot Vacuum Pro</option>
                <option>Microwave Smart</option>
            </select><br><br>

            <label>Оберіть Спосіб доставки:</label><br>
            <select name="delivery">
                <option>Самoвивіз</option>
                <option>Нова Пошта</option>
                <option>Укрпошта</option>
                <option>Meest доставка</option>
            </select><br><br>

            <button type="submit">📦 Замовити</button>
        </form>
    </section>
</main>
